
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101827">

    <title>Private Messenger | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>✦</span>
        </div>

        <h1>PRIVATE MESSENGER</h1>

        <p class="subtitle">
            Your private world of conversations.
        </p>

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="description">
                Sign in to access your private conversation.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    SIGN IN →
                </button>

                <p id="loginError" class="error"></p>

            </form>

        </div>

        <p class="security-note">
            🔒 Private access for two authorized participants only.
        </p>

        <footer>
            PRIVATE MESSENGER © 2026
        </footer>

    </div>

    <script type="module" src="auth.js"></script>

</body>
</html>
